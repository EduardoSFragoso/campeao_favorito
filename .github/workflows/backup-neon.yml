name: Backup do Neon

# Dump diário do banco (pg_dump custom) criptografado com gpg simétrico.
# O dump criptografado é publicado como artifact do run (retenção 30 dias).
# NUNCA subir o dump cru: em repo público, artifacts são baixáveis por
# qualquer pessoa — a criptografia é o que protege o conteúdo.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   NEON_DATABASE_URL — connection string DIRETA (sem -pooler) do Neon,
#     com a role de backup; pg_dump não deve passar pelo PgBouncer.
#   BACKUP_PASSPHRASE — passphrase forte; quem guarda a passphrase faz o
#     backup valer de algo. Sem ela, o .gpg é lixo.
#
# O agendamento do GitHub não é pontual (pode atrasar em horário de pico) e
# um schedule fica inativo após 60 dias de repo sem atividade — por isso o
# workflow_dispatch (Run workflow) é o gatilho manual de teste.

on:
  schedule:
    # fora do congestionamento do topo da hora (0–15) da fila do GitHub
    - cron: "27 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-neon
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump + gpg
    runs-on: ubuntu-latest
    steps:
      - name: Instala postgresql-client 17 (mesma versão do banco)
        run: |
          set -euo pipefail
          # O cliente 16 pré-instalado no ubuntu-latest NÃO serve: pg_dump recusa servidor
          # mais novo ("server version mismatch") — o Neon roda 17. Por isso o apt externo.
          # A chave do repositório pgdg é fixada por FINGERPRINT antes de assinar o apt:
          # um repositório trocado/injectado não aprove.
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          esperada="B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          obtida=$(gpg --show-keys --with-colons /tmp/pgdg.asc \
            | awk -F: '/^fpr:/{print $10; exit}')
          echo "fingerprint da chave pgdg: $obtida"
          if [ "$obtida" != "$esperada" ]; then
            echo "::error::Fingerprint da chave do repositório pgdg inesperada — abortando."
            exit 1
          fi
          sudo cp /tmp/pgdg.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: pg_dump criptografado com gpg
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${BACKUP_PASSPHRASE:-}" ]; then
              echo "::error::Secrets NEON_DATABASE_URL e/ou BACKUP_PASSPHRASE ausentes — cadastre antes de rodar."
              exit 1
          fi
          pg_dump "$DATABASE_URL" --format=custom --file backup.dump
          # Valida o dump ANTES de criptografar: um dump truncado pode gerar um .gpg que
          # "abre" (o roundtrip gpg abaixo testaria só a passphrase), então a prova real
          # é o TOC — o banco tem 3 tabelas (users, favorites, flyway_schema_history).
          pg_restore --list backup.dump > toc.txt
          tabelas=$(grep -c "TABLE DATA" toc.txt || true)
          if [ "${tabelas:-0}" -lt 3 ]; then
            echo "::error::Dump tem ${tabelas:-0} entradas TABLE DATA (mínimo esperado: 3) — possivelmente truncado/corrompido. Abortando."
            head -40 toc.txt
            exit 1
          fi
          echo "TOC OK: ${tabelas} tabelas com dados"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output backup.dump.gpg backup.dump
          rm -f backup.dump

      - name: Prova do roundtrip (sem o dump, o backup não serve)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --decrypt --output /dev/null backup.dump.gpg
          echo "roundtrip gpg OK — o .gpg abre com a passphrase cadastrada"

      - name: Publica artifact (só o .gpg)
        # fixado por SHA do commit (tag v7)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backup-neon-${{ github.run_id }}
          path: backup.dump.gpg
          retention-days: 30
          if-no-files-found: error
