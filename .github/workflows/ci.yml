name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: build backend (verify + spotless)
    runs-on: ubuntu-latest

    # Postgres efêmero: o smoke test (ApiApplicationTests) sobe o contexto com
    # Flyway migrando do zero — migrações testadas na CI, como no handoff
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: champion_favorito
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/champion_favorito

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (compile + tests + spotless check)
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: lint & build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Prettier check
        working-directory: frontend
        run: npm run format:check
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npx ng test --watch=false
      - name: Build
        working-directory: frontend
        run: npx ng build
