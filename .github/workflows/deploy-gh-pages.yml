name: Deploy Angular ao GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # URL do backend em produção vem da variável de repositório API_URL
      # (Settings → Secrets and variables → Actions → Variables)
      - name: Escreve config.json de produção
        run: |
          cat > frontend/public/config.json <<EOF
          { "apiUrl": "${{ vars.API_URL }}" }
          EOF
          cat frontend/public/config.json

      # A CSP do index.html leva a origem da API na mão (meta tag); o valor commitado é o
      # placeholder de dev (o mesmo host do config.json local). O deploy troca pela origem
      # real — se a API mudar de endereço atualize o placeholder do index.html TAMBÉM.
      - name: Substitui a origem da API na CSP do index.html
        run: |
          set -euo pipefail
          sed -i "s|https://147-15-57-6.sslip.io|${{ vars.API_URL }}|g" frontend/src/index.html
          grep -q "${{ vars.API_URL }}" frontend/src/index.html

      - name: Build (base href do subpath do gh-pages)
        working-directory: frontend
        run: |
          npm ci
          npx ng build --base-href "/${GITHUB_REPOSITORY##*/}/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
