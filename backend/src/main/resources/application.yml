spring:
  application:
    name: champion-favorites-api
  datasource:
    # Neon: use a connection string do painel com ?sslmode=require
    url: ${DB_URL:jdbc:postgresql://localhost:5432/champion_favorito}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 4
  jpa:
    # o esquema é governado pelo Flyway (db/migration); o Hibernate só valida
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # produção já tem o esquema criado pelo ddl-auto anterior: baseline na v1 e as
    # próximas migrações (V2+) é que rodam de verdade lá; banco novo roda a V1
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${PORT:8080}

app:
  jwt:
    # gere um secret forte: openssl rand -base64 64 (mínimo 32 bytes). O JwtService RECUSA
    # este placeholder em qualquer ambiente sem o perfil dev ou test ativo explicitamente.
    secret: ${JWT_SECRET:troque-este-secret-em-producao-com-uma-chave-de-64-bytes-no-minimo!!}
    expiration-ms: 604800000 # 7 dias
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # e-mail de verificação: SEM host o transporte é o de LOG. Credenciais na VM via env (
  # nomes em .env.example); starttls é o padrão da porta 587.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      "mail.smtp.auth": ${SMTP_AUTH:true}
      "mail.smtp.starttls.enable": true
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 10000
      "mail.smtp.writetimeout": 10000
  smtp:
    # espelho de spring.mail.host + remetente para o MailConfig escolher o transporte
    host: ${SMTP_HOST:}
    from: ${SMTP_FROM:}

riot:
  api:
    key: ${RIOT_API_KEY:}
    default-platform: br1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    br.com.favorito.api: DEBUG
