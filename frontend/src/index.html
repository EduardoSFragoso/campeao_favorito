<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Campeões Favoritos — League of Legends</title>
    <base href="/" />
    <!--
      CSP via <meta>: o GitHub Pages impõe cabeçalhos HTTP. O texto da política é
      coberto por src/csp.spec.ts. Em <meta> não funciona frame-ancestors; o resto é
      suportado: connect-src com as CDNs de dados E a origem da API, img-src com
      Data Dragon e Community Dragon (splashes/ícones), scripts só da própria origem
      (o CSS crítico fica inline-desligado: inlineCritical:false) e style-src
      'unsafe-inline' porque o Angular injeta estilos de componente em runtime.
      A origem `https://147-15-57-6.sslip.io` no connect-src É O PLACEHOLDER: o deploy
      substitui pela origem real de ${{ vars.API_URL }} (deploy-gh-pages.yml) antes do
      build; para o ng serve de dev vale o mesmo host do config.json local.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data: https://ddragon.leagueoflegends.com https://raw.communitydragon.org; connect-src 'self' https://ddragon.leagueoflegends.com https://raw.communitydragon.org https://147-15-57-6.sslip.io"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore campeões de LoL: splasharts, lore, skills, favoritos e busca de invocador com a Riot API."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
